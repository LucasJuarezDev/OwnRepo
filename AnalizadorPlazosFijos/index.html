<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="estilos.css">
</head>
<body>
  <main class="contenedor">

    <!-- ===== BLOQUE 1: Capital a invertir ===== -->
    <section class="tarjeta">
      <h2>Capital a invertir</h2>
      <label for="capital">Monto</label>
      <input type="text" id="capital" inputmode="decimal" autocomplete="off" >
    </section>

    <!-- ===== BLOQUE 2: Tasas TNA históricas de cada banco (9 inputs) ===== -->
    <div class="grilla-bancos">
      <section class="tarjeta">
        <h2>Banco Nación</h2>
        <label for="nacion-2023">TNA 2023 (%)</label>
        <input type="text" id="nacion-2023" inputmode="decimal" autocomplete="off" placeholder="en %">
        <label for="nacion-2024">TNA 2024 (%)</label>
        <input type="text" id="nacion-2024" inputmode="decimal" autocomplete="off" placeholder="en %">
        <label for="nacion-2025">TNA 2025 (%)</label>
        <input type="text" id="nacion-2025" inputmode="decimal" autocomplete="off" placeholder="en %">
      </section>

      <section class="tarjeta">
        <h2>Banco Provincia</h2>
        <label for="provincia-2023">TNA 2023 (%)</label>
        <input type="text" id="provincia-2023" inputmode="decimal" autocomplete="off" placeholder="en %">
        <label for="provincia-2024">TNA 2024 (%)</label>
        <input type="text" id="provincia-2024" inputmode="decimal" autocomplete="off" placeholder="en %">
        <label for="provincia-2025">TNA 2025 (%)</label>
        <input type="text" id="provincia-2025" inputmode="decimal" autocomplete="off" placeholder="en %">
      </section>

      <section class="tarjeta">
        <h2>Banco Hipotecario</h2>
        <label for="hipotecario-2023">TNA 2023 (%)</label>
        <input type="text" id="hipotecario-2023" inputmode="decimal" autocomplete="off" placeholder="en %">
        <label for="hipotecario-2024">TNA 2024 (%)</label>
        <input type="text" id="hipotecario-2024" inputmode="decimal" autocomplete="off" placeholder="en %">
        <label for="hipotecario-2025">TNA 2025 (%)</label>
        <input type="text" id="hipotecario-2025" inputmode="decimal" autocomplete="off" placeholder="en %">
      </section>
    </div>

    <!-- ===== BLOQUE 3: Botón Calcular y zona de errores ===== -->
    <button type="button" id="boton-calcular">Calcular</button>
    <div id="zona-errores" class="zona-errores" role="alert" hidden></div>

    <!-- ===== BLOQUE 4: Resultados (aparecen después de calcular) ===== -->
    <section id="zona-resultados" class="tarjeta" hidden>
      <h2>Resultados</h2>
      <p>Capital invertido: <strong id="capital-invertido"></strong></p>

      <div class="tabla-scroll">
        <table>
          <thead>
            <tr>
              <th>Banco</th>
              <th>TNA promedio</th>
              <th>Anual</th>
              <th>Trimestral</th>
              <th>Mensual</th>
            </tr>
          </thead>
          <tbody id="cuerpo-tabla"></tbody>
        </table>
      </div>

      <p id="recomendacion" class="recomendacion"></p>
    </section>

  </main>

  <script src="app.js"></script>
</body>
</html>
